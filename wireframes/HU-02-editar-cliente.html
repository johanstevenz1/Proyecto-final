<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HU-02: Editar Cliente</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
.navbar { background: linear-gradient(135deg, #2196F3, #1976D2); color: white; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; }
.navbar h1 { font-size: 1.3em; }
.navbar .nav-links a { color: white; text-decoration: none; margin-left: 20px; opacity: 0.8; }
.breadcrumb { padding: 15px 30px; background: white; border-bottom: 1px solid #e0e0e0; font-size: 0.85em; color: #666; }
.breadcrumb a { color: #1976D2; text-decoration: none; }
.container { max-width: 800px; margin: 30px auto; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
.form-header { background: #fff3e0; padding: 25px 30px; border-bottom: 1px solid #ffe0b2; display: flex; align-items: center; gap: 15px; }
.form-header .icon { font-size: 2em; }
.form-header h2 { color: #e65100; font-size: 1.4em; }
.form-header p { color: #666; font-size: 0.9em; }
.form-body { padding: 30px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.form-group { margin-bottom: 20px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 0.9em; }
.form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95em; }
.form-group input[disabled] { background: #f5f5f5; color: #999; cursor: not-allowed; }
.form-group .locked { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: #999; margin-top: 4px; }
.form-actions { display: flex; gap: 15px; justify-content: flex-end; padding: 20px 30px; background: #fafafa; border-top: 1px solid #e0e0e0; }
.btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 0.95em; font-weight: 600; cursor: pointer; }
.btn-primary { background: #FF9800; color: white; }
.btn-secondary { background: #e0e0e0; color: #333; }
.wireframe-label { position: fixed; top: 10px; right: 10px; background: #ff9800; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 600; z-index: 100; }
</style>
</head>
<body>
<div class="wireframe-label">WIREFRAME - HU-02</div>
<div class="navbar"><h1>🐾 Jovan Pets</h1><div class="nav-links"><a href="#">Dashboard</a><a href="#">Clientes</a><a href="#">Mascotas</a></div></div>
<div class="breadcrumb"><a href="#">Inicio</a> / <a href="#">Clientes</a> / Editar Cliente</div>
<div class="container">
<div class="form-header"><div class="icon">✏️</div><div><h2>Editar Cliente</h2><p>Modifique la información del cliente</p></div></div>
<div class="form-body">
<div class="form-row">
<div class="form-group"><label>Nombre Completo</label><input type="text" value="Juan Pérez García"></div>
<div class="form-group"><label>Cédula</label><input type="text" value="1234567890" disabled><div class="locked">🔒 Campo no editable</div></div>
</div>
<div class="form-row">
<div class="form-group"><label>Teléfono</label><input type="tel" value="310 123 4567"></div>
<div class="form-group"><label>Email</label><input type="email" value="juan@email.com"></div>
</div>
<div class="form-group full"><label>Dirección</label><input type="text" value="Calle 45 #12-34, Barrio Centro"></div>
</div>
<div class="form-actions"><button class="btn btn-secondary">Cancelar</button><button class="btn btn-primary">Guardar Cambios</button></div>
</div>
</body>
</html>
