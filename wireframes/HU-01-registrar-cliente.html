<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HU-01: Registrar Cliente</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
.navbar { background: linear-gradient(135deg, #2196F3, #1976D2); color: white; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; }
.navbar h1 { font-size: 1.3em; }
.navbar .nav-links a { color: white; text-decoration: none; margin-left: 20px; opacity: 0.8; }
.breadcrumb { padding: 15px 30px; background: white; border-bottom: 1px solid #e0e0e0; font-size: 0.85em; color: #666; }
.breadcrumb a { color: #1976D2; text-decoration: none; }
.container { max-width: 800px; margin: 30px auto; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
.form-header { background: #e3f2fd; padding: 25px 30px; border-bottom: 1px solid #bbdefb; }
.form-header h2 { color: #1565c0; font-size: 1.4em; margin-bottom: 5px; }
.form-header p { color: #666; font-size: 0.9em; }
.form-body { padding: 30px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.form-group { margin-bottom: 20px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 0.9em; }
.form-group label .required { color: #e53935; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95em; transition: border-color 0.3s; }
.form-group input:focus, .form-group select:focus { border-color: #2196F3; outline: none; }
.form-group .hint { font-size: 0.8em; color: #999; margin-top: 4px; }
.form-actions { display: flex; gap: 15px; justify-content: flex-end; padding: 20px 30px; background: #fafafa; border-top: 1px solid #e0e0e0; }
.btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 0.95em; font-weight: 600; cursor: pointer; }
.btn-primary { background: #2196F3; color: white; }
.btn-secondary { background: #e0e0e0; color: #333; }
.wireframe-label { position: fixed; top: 10px; right: 10px; background: #ff9800; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 600; z-index: 100; }
</style>
</head>
<body>
<div class="wireframe-label">WIREFRAME - HU-01</div>
<div class="navbar"><h1>🐾 Jovan Pets</h1><div class="nav-links"><a href="#">Dashboard</a><a href="#">Clientes</a><a href="#">Mascotas</a><a href="#">Citas</a><a href="#">Productos</a></div></div>
<div class="breadcrumb"><a href="#">Inicio</a> / <a href="#">Clientes</a> / Registrar Cliente</div>
<div class="container">
<div class="form-header"><h2>Registrar Nuevo Cliente</h2><p>Complete los datos del propietario de la mascota</p></div>
<div class="form-body">
<div class="form-row">
<div class="form-group"><label>Nombre Completo <span class="required">*</span></label><input type="text" placeholder="Ej: Juan Pérez García"></div>
<div class="form-group"><label>Cédula <span class="required">*</span></label><input type="text" placeholder="Ej: 1234567890"><div class="hint">Debe ser única en el sistema</div></div>
</div>
<div class="form-row">
<div class="form-group"><label>Teléfono <span class="required">*</span></label><input type="tel" placeholder="Ej: 310 123 4567"></div>
<div class="form-group"><label>Email <span class="required">*</span></label><input type="email" placeholder="Ej: juan@email.com"></div>
</div>
<div class="form-group full"><label>Dirección <span class="required">*</span></label><input type="text" placeholder="Ej: Calle 45 #12-34, Barrio Centro"></div>
</div>
<div class="form-actions"><button class="btn btn-secondary">Cancelar</button><button class="btn btn-primary">Guardar Cliente</button></div>
</div>
</body>
</html>
