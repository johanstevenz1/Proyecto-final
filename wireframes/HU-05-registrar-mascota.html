<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HU-05: Registrar Mascota</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
.navbar { background: linear-gradient(135deg, #2196F3, #1976D2); color: white; padding: 15px 30px; }
.navbar h1 { font-size: 1.3em; }
.breadcrumb { padding: 15px 30px; background: white; border-bottom: 1px solid #e0e0e0; font-size: 0.85em; color: #666; }
.breadcrumb a { color: #1976D2; text-decoration: none; }
.container { max-width: 800px; margin: 30px auto; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
.form-header { background: #e8f5e9; padding: 25px 30px; border-bottom: 1px solid #c8e6c9; display: flex; align-items: center; gap: 15px; }
.form-header .icon { font-size: 2em; }
.form-header h2 { color: #2e7d32; font-size: 1.4em; }
.form-body { padding: 30px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 0.9em; }
.form-group label .required { color: #e53935; }
.form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95em; }
.owner-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f1f8e9; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c5e1a5; }
.owner-card .avatar { width: 40px; height: 40px; background: #4CAF50; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; }
.owner-card .name { font-weight: 600; color: #333; }
.owner-card .doc { font-size: 0.85em; color: #666; }
.form-actions { display: flex; gap: 15px; justify-content: flex-end; padding: 20px 30px; background: #fafafa; border-top: 1px solid #e0e0e0; }
.btn { padding: 12px 30px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #4CAF50; color: white; }
.btn-secondary { background: #e0e0e0; color: #333; }
.wireframe-label { position: fixed; top: 10px; right: 10px; background: #ff9800; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 600; z-index: 100; }
</style>
</head>
<body>
<div class="wireframe-label">WIREFRAME - HU-05</div>
<div class="navbar"><h1>Jovan Pets</h1></div>
<div class="breadcrumb"><a href="#">Inicio</a> / Mascotas / Registrar Mascota</div>
<div class="container">
<div class="form-header"><div class="icon">🐕</div><div><h2>Registrar Nueva Mascota</h2></div></div>
<div class="form-body">
<div class="owner-card"><div class="avatar">JP</div><div><div class="name">Juan Pérez García</div><div class="doc">Cédula: 1234567890</div></div></div>
<div class="form-row">
<div class="form-group"><label>Nombre <span class="required">*</span></label><input type="text" placeholder="Ej: Max"></div>
<div class="form-group"><label>Especie <span class="required">*</span></label><select><option>Perro</option><option>Gato</option><option>Ave</option><option>Otro</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label>Raza <span class="required">*</span></label><input type="text" placeholder="Ej: Labrador"></div>
<div class="form-group"><label>Sexo <span class="required">*</span></label><select><option>Macho</option><option>Hembra</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label>Fecha de Nacimiento</label><input type="date"></div>
<div class="form-group"><label>Peso (kg) <span class="required">*</span></label><input type="number" step="0.1" placeholder="12.5"></div>
</div>
</div>
<div class="form-actions"><button class="btn btn-secondary">Cancelar</button><button class="btn btn-primary">Registrar Mascota</button></div>
</div>
</body>
</html>
