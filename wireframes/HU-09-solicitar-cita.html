<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HU-09: Solicitar Cita</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f5}
.navbar{background:linear-gradient(135deg,#2196F3,#1976D2);color:white;padding:15px 30px}
.navbar h1{font-size:1.3em}
.breadcrumb{padding:15px 30px;background:white;border-bottom:1px solid #e0e0e0;font-size:.85em;color:#666}
.breadcrumb a{color:#1976D2;text-decoration:none}
.container{max-width:800px;margin:30px auto;background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.form-header{background:#e3f2fd;padding:25px 30px;border-bottom:1px solid #bbdefb}
.form-header h2{color:#1565c0;font-size:1.4em}
.form-header p{color:#666;font-size:.9em}
.form-body{padding:30px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.form-group{margin-bottom:20px}
.form-group.full{grid-column:1/-1}
.form-group label{display:block;margin-bottom:6px;font-weight:600;color:#333;font-size:.9em}
.form-group label .required{color:#e53935}
.form-group input,.form-group select{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:.95em}
.time-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.time-slot{padding:10px;border:2px solid #e0e0e0;border-radius:8px;text-align:center;cursor:pointer;font-size:.9em}
.time-slot:hover{border-color:#2196F3;background:#e3f2fd}
.time-slot.selected{border-color:#2196F3;background:#2196F3;color:white}
.time-slot.disabled{background:#f5f5f5;color:#ccc;cursor:not-allowed}
.form-actions{display:flex;gap:15px;justify-content:flex-end;padding:20px 30px;background:#fafafa;border-top:1px solid #e0e0e0}
.btn{padding:12px 30px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn-primary{background:#2196F3;color:white}
.btn-secondary{background:#e0e0e0;color:#333}
.wireframe-label{position:fixed;top:10px;right:10px;background:#ff9800;color:white;padding:5px 12px;border-radius:20px;font-size:.75em;font-weight:600;z-index:100}
</style>
</head>
<body>
<div class="wireframe-label">WIREFRAME - HU-09</div>
<div class="navbar"><h1>Jovan Pets</h1></div>
<div class="breadcrumb"><a href="#">Inicio</a> / Citas / Solicitar Cita</div>
<div class="container">
<div class="form-header"><h2>Solicitar Nueva Cita</h2><p>Seleccione el servicio, fecha y hora para su mascota</p></div>
<div class="form-body">
<div class="form-row">
<div class="form-group"><label>Mascota <span class="required">*</span></label><select><option>Max (Labrador)</option><option>Luna (Gato)</option></select></div>
<div class="form-group"><label>Servicio <span class="required">*</span></label><select><option>Consulta General</option><option>Vacunacion</option><option>Desparasitacion</option><option>Cirugia</option><option>Peluqueria</option></select></div>
</div>
<div class="form-group full"><label>Fecha <span class="required">*</span></label><input type="date"></div>
<div class="form-group full"><label>Horas Disponibles <span class="required">*</span></label>
<div class="time-slots">
<div class="time-slot disabled">8:00</div>
<div class="time-slot disabled">8:30</div>
<div class="time-slot">9:00</div>
<div class="time-slot selected">9:30</div>
<div class="time-slot">10:00</div>
<div class="time-slot">10:30</div>
<div class="time-slot disabled">11:00</div>
<div class="time-slot">11:30</div>
<div class="time-slot">14:00</div>
<div class="time-slot">14:30</div>
<div class="time-slot">15:00</div>
<div class="time-slot">15:30</div>
</div>
<p style="margin-top:10px;font-size:.8em;color:#999">* Los horarios en gris ya estan ocupados</p>
</div>
</div>
<div class="form-actions"><button class="btn btn-secondary">Cancelar</button><button class="btn btn-primary">Confirmar Cita</button></div>
</div>
</body>
</html>
