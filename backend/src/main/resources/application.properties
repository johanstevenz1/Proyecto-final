spring.application.name=jovan-pets

# Archivo local opcional con variables de entorno de desarrollo (no se versiona; ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Servidor
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# MongoDB (configuracion externa mediante variables de entorno)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jovanpets}
spring.data.mongodb.auto-index-creation=true

# Seguridad: el secreto JWT debe venir de una variable de entorno (minimo 32 caracteres)
app.jwt.secreto=${JWT_SECRET:}
app.jwt.minutos=${JWT_MINUTOS:30}
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Administrador inicial (solo se crea si ambas variables existen y no hay administradores)
app.admin.email=${ADMIN_EMAIL:}
app.admin.clave=${ADMIN_PASSWORD:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador Jovan Pets}

# Catalogo inicial de servicios y productos (solo si las colecciones estan vacias)
app.datos-iniciales=${APP_DATOS_INICIALES:false}

# Agenda
app.zona-horaria=America/Bogota
app.agenda.jornadas=08:00-12:00,14:00-18:00
app.agenda.intervalo-minutos=15

# Cuentas de demostracion (opcional): cliente con mascotas, citas y pedido, y un veterinario
app.demo.cliente.email=${DEMO_CLIENTE_EMAIL:}
app.demo.cliente.clave=${DEMO_CLIENTE_PASSWORD:}
app.demo.veterinario.email=${DEMO_VETERINARIO_EMAIL:}
app.demo.veterinario.clave=${DEMO_VETERINARIO_PASSWORD:}
